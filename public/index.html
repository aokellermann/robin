<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<div id="login">
    <h1>Robin Rooms</h1>
    <input id="l-email" type="email" placeholder="Email" autocomplete="username">
    <input id="l-pass" type="password" placeholder="Robin password" autocomplete="current-password">
    <p class="err" id="l-err"></p>
    <button class="primary" id="l-go">Sign in</button>
</div>

<div id="site" hidden>
    <h1>Choose a building</h1>
    <div id="site-list"></div>
</div>

<div id="app">
    <header>
        <button class="title" id="sitename" title="Switch building"></button>
        <button id="prev">‹</button>
        <button id="today">Today</button>
        <button id="next">›</button>
        <span class="datelabel" id="datelabel"></span>
        <input type="date" id="datepick">
        <select id="mincap">
            <option value="0">Any size</option>
            <option value="2">2+</option>
            <option value="4">4+</option>
            <option value="6">6+</option>
            <option value="10">10+</option>
        </select>
        <details id="amenfilter">
            <summary>Amenities</summary>
            <div class="menu" id="amenmenu"></div>
        </details>
        <button id="viewtoggle">Map</button>
        <span class="spacer"></span>
        <span id="status"></span>
        <button id="refresh">Refresh</button>
        <span class="who" id="who"></span>
        <button id="logout">Log out</button>
    </header>
    <div id="gridwrap">
        <table id="grid"></table>
    </div>
    <div id="mapwrap">
        <div id="mapbar">
            <span id="floors"></span>
            <select id="maptime"></select>
        </div>
        <div id="mapbox"><div id="mapinner"></div></div>
    </div>
    <div id="pop"></div>
</div>

<div id="toast"></div>

</body>
</html>
