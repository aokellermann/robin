<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<div id="login">
    <h1>Robin Rooms</h1>
    <input id="l-email" type="email" placeholder="Email" autocomplete="username">
    <input id="l-pass" type="password" placeholder="Robin password" autocomplete="current-password">
    <p class="err" id="l-err"></p>
    <button class="primary" id="l-go">Sign in</button>
</div>

<div id="site" hidden>
    <h1>Choose a building</h1>
    <div id="site-list"></div>
</div>

<div id="app">
    <header>
        <button class="title" id="sitename" title="Switch building"></button>
        <button id="prev">‹</button>
        <button id="today">Today</button>
        <button id="next">›</button>
        <span class="datewrap">
            <button class="datelabel" id="datelabel" title="Pick a date"></button>
            <input type="date" id="datepick" tabindex="-1" aria-hidden="true">
        </span>
        <select id="mincap">
            <option value="0">Any size</option>
            <option value="2">2+</option>
            <option value="4">4+</option>
            <option value="6">6+</option>
            <option value="10">10+</option>
        </select>
        <details id="amenfilter">
            <summary>Amenities</summary>
            <div class="menu" id="amenmenu"></div>
        </details>
        <select id="freeat" title="Only rooms free for 30 minutes from this time"></select>
        <button id="viewtoggle">Map</button>
        <span class="spacer"></span>
        <span id="status"></span>
        <button id="refresh">Refresh</button>
        <span class="who" id="who"></span>
        <button id="logout">Log out</button>
    </header>
    <div id="myday" hidden></div>
    <div id="gridwrap">
        <table id="grid"></table>
    </div>
    <div id="mapwrap">
        <div id="mapbar">
            <span id="floors"></span>
            <button id="defaultfloor" title="Open the map on this floor by default"></button>
        </div>
        <div id="mapbox"><div id="mapinner"></div></div>
    </div>
    <div id="pop"></div>
</div>

<div id="toast"></div>
<datalist id="people"></datalist>

</body>
</html>
